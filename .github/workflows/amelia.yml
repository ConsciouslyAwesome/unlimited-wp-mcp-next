name: Amelia adapter
on:
  pull_request:
  push:
    branches: [codex/amelia-native-management]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Amelia guard tests
        run: php tests/amelia.php
      - name: Existing standalone regression tests
        run: |
          php tests/approvals.php
          php tests/approvals.php sql
          php tests/connection.php
          php tests/updates.php
          php tests/update-recovery.php
      - name: Gateway regression tests
        run: node --test gateway/tests/*.test.mjs
