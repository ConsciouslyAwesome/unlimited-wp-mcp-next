name: Unlimited updater
on:
  pull_request:
  push:
    branches: [main, codex/unlimited-next]
jobs:
  updates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php tests/updates.php
